name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: movie
      - uses: actions/checkout@v4
        with:
          repository: Ahmetdinx/Favo.Books
          path: books
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: movie/global.json
      - run: dotnet build Favo.Movie.slnx -c Release
        working-directory: movie
      - run: dotnet run --project tests/Favo.Movie.Checks -c Release --no-build
        working-directory: movie
      - run: dotnet run --project tests/Favo.Movie.CommunityChecks -c Release -p:BooksRoot=$GITHUB_WORKSPACE/books
        working-directory: movie
        env:
          FAVO_BOOKS_ROOT: ${{ github.workspace }}/books
          FAVO_MOVIE_ROOT: ${{ github.workspace }}/movie

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
